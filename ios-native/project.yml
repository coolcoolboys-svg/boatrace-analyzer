name: BoatRaceAnalyzer
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0
targets:
  BoatRaceAnalyzer:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.boatraceanalyzer.nativepreview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_GADApplicationIdentifier: "$(ADMOB_APP_ID)"
        INFOPLIST_KEY_AdMobBannerID: "$(ADMOB_BANNER_ID)"
        ADMOB_APP_ID: "ca-app-pub-9638556154023117~1259902816"
        ADMOB_BANNER_ID: "ca-app-pub-9638556154023117/4317310992"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Boat Race Analyzer"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          ADMOB_BANNER_ID: "ca-app-pub-3940256099942544/2435281174"
