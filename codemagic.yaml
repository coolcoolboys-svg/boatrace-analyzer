workflows:
  ios-testflight:
    name: ボートレースアナライザー TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: noreru-appstore
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.boatraceanalyzer.nativepreview
    scripts:
      - name: Generate project
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          cd ios-native
          # TestFlight uses Google's test banner to avoid live ad traffic during testing.\n          sed -i '' 's|ca-app-pub-9638556154023117/4317310992|ca-app-pub-3940256099942544/2435281174|g' project.yml\n          xcodegen generate
      - name: Configure signing
        script: xcode-project use-profiles
      - name: Build signed package
        script: xcode-project build-ipa --project "$CM_BUILD_DIR/ios-native/BoatRaceAnalyzer.xcodeproj" --scheme BoatRaceAnalyzer
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
