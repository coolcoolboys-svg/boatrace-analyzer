workflows:
  ios-testflight:
    name: Boat Race Analyzer TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: NoreruBus-iOS
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.boatraceanalyzer.nativepreview
    scripts:
      - name: Load iOS source
        script: |
          set -euo pipefail
          git fetch origin feature/ios-native-test
          git checkout --detach FETCH_HEAD
      - name: Verify race data source
        script: |
          python3 - <<'PY'
          import json, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          day = now.strftime("%Y%m%d")
          url = f"https://boatraceopenapi.github.io/api/v1/{day[:4]}/{day}.json"
          with urllib.request.urlopen(url, timeout=30) as response:
              root = json.load(response)
          stadiums = root["programs"]["stadiums"]
          races = [r for st in stadiums.values() for r in st.get("races",{}).values()]
          examples = [r.get("closed_at") for r in races if r.get("closed_at")]
          valid = [r for r in races if all(str(i) in r.get("racers",{}) for i in range(1,7))]
          print(f"JST date: {day}; venues: {len(stadiums)}; races: {len(races)}; complete entries: {len(valid)}; sample deadlines: {examples[:3]}")
          PY
      - name: Generate project
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          cd ios-native
          swift make_icon.swift
          xcodegen generate
      - name: Configure signing
        script: xcode-project use-profiles
      - name: Build signed package
        script: xcode-project build-ipa --project "$CM_BUILD_DIR/ios-native/BoatRaceAnalyzer.xcodeproj" --scheme BoatRaceAnalyzer
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
